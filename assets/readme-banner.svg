<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">TZMeet</title><desc id="d">Time zones align across a shared meeting window.</desc><defs><linearGradient id="bg"><stop stop-color="#192a40"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g stroke="#3a536c" stroke-width="2"><path d="M150 90H1050M150 150H1050M150 210H1050"/></g><g fill="#62e3c1"><rect x="340" y="78" width="180" height="24" rx="8"><animate attributeName="opacity" values=".5;1;.5" dur="2.4s" repeatCount="indefinite"/></rect><rect x="480" y="138" width="240" height="24" rx="8"/><rect x="600" y="198" width="170" height="24" rx="8"/></g><g fill="#edf3ff" font-family="monospace" font-size="16"><text x="90" y="96">UTC</text><text x="90" y="156">ZONE A</text><text x="90" y="216">ZONE B</text></g><path d="M520 90V240M720 150V240" stroke="#a89bff" stroke-width="2" stroke-dasharray="5 8"><animate attributeName="stroke-dashoffset" values="0;-52" dur="2s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">TZMEET</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">TIME ZONES / OVERLAP / PLAN</text></svg>